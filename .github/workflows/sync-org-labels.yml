# Copy to: <host-repo>/.github/workflows/sync-org-labels.yml
name: Sync org labels

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Create or update labels on every non-archived repo
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
          ORG: Tardigrade-Apps
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, subprocess, yaml

          org = os.environ["ORG"]
          with open(".github/labels.yml", encoding="utf-8") as f:
              labels = yaml.safe_load(f)

          repos = subprocess.check_output(
              [
                  "gh", "repo", "list", org,
                  "--no-archived", "--limit", "1000",
                  "--json", "nameWithOwner",
                  "-q", ".[].nameWithOwner",
              ],
              text=True,
          ).splitlines()

          print(f"Repos: {len(repos)}; labels: {len(labels)}")
          for repo in repos:
              print(f"==> {repo}")
              for item in labels:
                  subprocess.run(
                      [
                          "gh", "label", "create", item["name"],
                          "--repo", repo,
                          "--color", item["color"],
                          "--description", item["description"],
                          "--force",
                      ],
                      check=True,
                  )
          print("Done.")
          PY
