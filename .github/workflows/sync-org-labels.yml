# Sync org labels

# Runs on: plentific/canonical (adhoc).
# Source: delivery/github-org-standards/labels.yml
# Requires secret ORG_STANDARDS_SYNC_TOKEN (fine-grained PAT: Issues R/W, Metadata R; all repos).

name: Sync org labels

on:
  workflow_dispatch:

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Sync labels to all non-archived repos
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
          ORG: Tardigrade-Apps
          STANDARDS_DIR: delivery/github-org-standards
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, subprocess, yaml
          from pathlib import Path

          org = os.environ["ORG"]
          labels_path = Path(os.environ["STANDARDS_DIR"]) / "labels.yml"

          repos = subprocess.check_output(
              [
                  "gh", "repo", "list", org,
                  "--no-archived", "--limit", "1000",
                  "--json", "nameWithOwner",
                  "-q", ".[].nameWithOwner",
              ],
              text=True,
          ).splitlines()

          labels = yaml.safe_load(labels_path.read_text(encoding="utf-8"))
          print(f"Repos: {len(repos)}; labels: {len(labels)}")

          for repo in repos:
              print(f"==> {repo}")
              for item in labels:
                  subprocess.run(
                      [
                          "gh", "label", "create", item["name"],
                          "--repo", repo,
                          "--color", item["color"],
                          "--description", item["description"],
                          "--force",
                      ],
                      check=True,
                  )

          print("Done.")
          PY
