# Sync org issue templates

# Runs on: plentific/canonical (adhoc).
# Source: delivery/github-org-standards/ISSUE_TEMPLATE/
# Opens a PR per repo; does not commit to the default branch.
# Requires secret ORG_STANDARDS_SYNC_TOKEN (fine-grained PAT:
# Contents R/W, Pull requests R/W, Metadata R; all repos).

name: Sync org issue templates

on:
  workflow_dispatch:

jobs:
  sync-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical
        uses: actions/checkout@v4

      - name: Open template-sync PRs on all non-archived repos
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
          ORG: Tardigrade-Apps
          STANDARDS_DIR: delivery/github-org-standards
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, subprocess, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          org = os.environ["ORG"]
          token = os.environ["GH_TOKEN"]
          templates_dir = Path(os.environ["STANDARDS_DIR"]) / "ISSUE_TEMPLATE"
          branch = "chore/sync-org-issue-templates"
          pr_title = "chore: sync org issue templates from canonical"
          pr_body = (
              "Automated sync from `plentific/canonical` "
              "(`delivery/github-org-standards/ISSUE_TEMPLATE/`).\n\n"
              "Do not edit these files here; change them in canonical and "
              "re-run **Sync org issue templates**."
          )

          def gh_api(method, path, data=None, ok_codes=()):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=None if data is None else json.dumps(data).encode(),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read().decode()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  if e.code in ok_codes:
                      return None
                  raise RuntimeError(f"{method} {path} -> {e.code}: {err}") from e

          repos = subprocess.check_output(
              [
                  "gh", "repo", "list", org,
                  "--no-archived", "--limit", "1000",
                  "--json", "nameWithOwner",
                  "-q", ".[].nameWithOwner",
              ],
              text=True,
          ).splitlines()

          template_files = sorted(templates_dir.glob("*.yml"))
          print(f"Repos: {len(repos)}; templates: {len(template_files)}")

          for repo in repos:
              print(f"==> {repo}")
              info = gh_api("GET", f"/repos/{repo}")
              default_branch = info["default_branch"]
              ref = gh_api("GET", f"/repos/{repo}/git/ref/heads/{default_branch}")
              base_sha = ref["object"]["sha"]
              base_commit = gh_api("GET", f"/repos/{repo}/git/commits/{base_sha}")

              tree_items = []
              for path in template_files:
                  rel = f".github/ISSUE_TEMPLATE/{path.name}"
                  local = path.read_bytes()
                  encoded = urllib.parse.quote(rel, safe="/")
                  existing = gh_api(
                      "GET",
                      f"/repos/{repo}/contents/{encoded}?ref={urllib.parse.quote(default_branch)}",
                      ok_codes=(404,),
                  )
                  if existing is not None:
                      remote = base64.b64decode(existing["content"])
                      if remote == local:
                          continue
                  tree_items.append(
                      {
                          "path": rel,
                          "mode": "100644",
                          "type": "blob",
                          "content": local.decode("utf-8"),
                      }
                  )

              if not tree_items:
                  print("    skip (already in sync)")
                  continue

              new_tree = gh_api(
                  "POST",
                  f"/repos/{repo}/git/trees",
                  {"base_tree": base_commit["tree"]["sha"], "tree": tree_items},
              )
              new_commit = gh_api(
                  "POST",
                  f"/repos/{repo}/git/commits",
                  {
                      "message": pr_title,
                      "tree": new_tree["sha"],
                      "parents": [base_sha],
                  },
              )
              commit_sha = new_commit["sha"]

              # GitHub returns 422 (not 404) when PATCHing a missing ref.
              existing_ref = gh_api(
                  "GET",
                  f"/repos/{repo}/git/refs/heads/{branch}",
                  ok_codes=(404,),
              )
              if existing_ref is None:
                  gh_api(
                      "POST",
                      f"/repos/{repo}/git/refs",
                      {"ref": f"refs/heads/{branch}", "sha": commit_sha},
                  )
              else:
                  gh_api(
                      "PATCH",
                      f"/repos/{repo}/git/refs/heads/{branch}",
                      {"sha": commit_sha, "force": True},
                  )

              owner = repo.split("/")[0]
              pulls = gh_api(
                  "GET",
                  f"/repos/{repo}/pulls?head={urllib.parse.quote(f'{owner}:{branch}')}&state=open",
              )
              if pulls:
                  print(f"    updated PR {pulls[0]['html_url']}")
                  continue

              pr = gh_api(
                  "POST",
                  f"/repos/{repo}/pulls",
                  {
                      "title": pr_title,
                      "head": branch,
                      "base": default_branch,
                      "body": pr_body,
                  },
              )
              print(f"    opened PR {pr['html_url']}")

          print("Done.")
          PY

