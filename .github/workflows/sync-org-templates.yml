# Sync org issue templates

# Runs on: plentific/canonical (adhoc).
# Source: delivery/github-org-standards/ISSUE_TEMPLATE/
# Requires secret ORG_STANDARDS_SYNC_TOKEN (fine-grained PAT: Contents R/W, Metadata R; all repos).

name: Sync org issue templates

on:
  workflow_dispatch:

jobs:
  sync-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical
        uses: actions/checkout@v4

      - name: Sync issue templates to all non-archived repos
        env:
          GH_TOKEN: ${{ secrets.LABEL_SYNC_TOKEN }}
          ORG: Tardigrade-Apps
          STANDARDS_DIR: delivery/github-org-standards
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, subprocess, urllib.error, urllib.request
          from pathlib import Path

          org = os.environ["ORG"]
          token = os.environ["GH_TOKEN"]
          templates_dir = Path(os.environ["STANDARDS_DIR"]) / "ISSUE_TEMPLATE"

          def gh_api(method, path, data=None):
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=None if data is None else json.dumps(data).encode(),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read().decode()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  raise RuntimeError(f"{method} {path} -> {e.code}: {err}") from e

          repos = subprocess.check_output(
              [
                  "gh", "repo", "list", org,
                  "--no-archived", "--limit", "1000",
                  "--json", "nameWithOwner",
                  "-q", ".[].nameWithOwner",
              ],
              text=True,
          ).splitlines()

          template_files = sorted(templates_dir.glob("*.yml"))
          print(f"Repos: {len(repos)}; templates: {len(template_files)}")

          for repo in repos:
              print(f"==> {repo}")
              for path in template_files:
                  rel = f".github/ISSUE_TEMPLATE/{path.name}"
                  content_b64 = base64.b64encode(path.read_bytes()).decode()
                  api_path = f"/repos/{repo}/contents/{rel}"
                  payload = {
                      "message": f"chore: sync org issue template {path.name} from canonical",
                      "content": content_b64,
                  }
                  try:
                      existing = gh_api("GET", api_path)
                      payload["sha"] = existing["sha"]
                  except RuntimeError as e:
                      if "404" not in str(e):
                          raise
                  gh_api("PUT", api_path, payload)
                  print(f"    wrote {rel}")

          print("Done.")
          PY
